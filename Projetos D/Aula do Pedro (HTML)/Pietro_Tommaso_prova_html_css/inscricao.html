        <form>

                <label for="idade">Idade: </label><input type="number" id="idade" name="idade" min="0" max="120"
                    step="1">

                <label for="data">Data de nascimento:</label>
                <input type="date" id="data" name="data"><br>
            </fieldset>
            <p>
