
<title>Exercicio 4 - Pares e ímpares com incremento de 2</title>
<meta charset="utf-8" />

<script>
    document.write("Pares: ");
    for (let i = 0; i <= 20; i += 2) {
        document.write(i + " ");
    }

    document.write("<br>");

    document.write("Ímpares: ");
    for (let i = 1; i <= 19; i += 2) {
        document.write(i + " ");
    }
</script>
